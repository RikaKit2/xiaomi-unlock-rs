name: Release & CI

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Publish as GitHub Release'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  check:
    name: Test & Lint
    runs-on: ubuntu-latest
    env:
      CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_LINKER: gcc
      CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS: ""
    steps:
      - uses: actions/checkout@v4

      - name: Configure Cargo for CI
        run: rm -f .cargo/config.toml

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev jq

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: clippy, rustfmt

      - name: Cargo fmt
        run: cargo fmt --all -- --check

      - name: Cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Cargo test
        run: cargo test --workspace

  build-release:
    name: Build Release Binary
    runs-on: ubuntu-latest
    needs: check
    env:
      CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_LINKER: gcc
      CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS: ""
    steps:
      - uses: actions/checkout@v4

      - name: Configure Cargo for CI
        run: rm -f .cargo/config.toml

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev jq

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@nightly

      - name: Build release binary
        run: cargo build --release -p xiaomi-unlock

      - name: Package release assets
        run: |
          PKG_VERSION=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name=="xiaomi-unlock") | "v" + .version')
          VERSION="${{ github.ref_name }}"
          if [ -z "$VERSION" ] || [ "$VERSION" = "main" ] || [ "$VERSION" = "master" ]; then
            VERSION="$PKG_VERSION"
          fi

          echo "Packaging version: ${VERSION}"

          # Compute SHA-256 for standalone binary
          sha256sum target/release/xiaomi-unlock > target/release/xiaomi-unlock.sha256

          # Create compressed tarball
          ARCHIVE_NAME="xiaomi-unlock-${VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          tar -czvf "${ARCHIVE_NAME}" -C target/release xiaomi-unlock
          sha256sum "${ARCHIVE_NAME}" > "${ARCHIVE_NAME}.sha256"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: xiaomi-unlock-linux-x86_64
          path: |
            target/release/xiaomi-unlock
            target/release/xiaomi-unlock.sha256

      - name: Publish to GitHub Releases
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.create_release)
        uses: softprops/action-gh-release@v2
        with:
          files: |
            target/release/xiaomi-unlock
            target/release/xiaomi-unlock.sha256
            xiaomi-unlock-*-x86_64-unknown-linux-gnu.tar.gz
            xiaomi-unlock-*-x86_64-unknown-linux-gnu.tar.gz.sha256
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
